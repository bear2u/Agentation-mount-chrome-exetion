<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Component Lens content script harness</title>
    <script>
      window.chrome = {
        runtime: { onMessage: { addListener() {} } },
        storage: { local: { async get() { return {}; }, async set() {} } }
      };
    </script>
  </head>
  <body>
    <main>
      <h1>일반 HTML 테스트 페이지</h1>
      <button id="plain-button" type="button">테스트 버튼</button>
    </main>
    <dialog id="native-modal">
      <h2>결제 확인</h2>
      <p>네이티브 팝업 안의 요소를 선택하는 테스트입니다.</p>
      <button id="modal-button" type="button">결제 요청 만들기</button>
    </dialog>
    <script src="/dist/content.js"></script>
    <script>document.querySelector('#native-modal').showModal();</script>
  </body>
</html>
